<div class="login-wrap">
  <form class="login-box" id="login-form" autocomplete="off" aria-labelledby="login-titel">
    <a class="logo" href="/login"><img src="/assets/img/logo.png" alt="Digitalkonzepte Desel" width="640" height="140"></a>
    <h1 id="login-titel">Geschützter Bereich</h1>
    <p>Bitte geben Sie das Passwort ein, um die Seite zu öffnen.</p>
    <label class="sr-only" for="pw">Passwort</label>
    <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" required autofocus>
    <button class="btn btn-primary" type="submit">Entsperren</button>
    <div class="login-err" id="login-err" role="alert"></div>
  </form>
  <p class="login-legal"><a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a></p>
</div>
