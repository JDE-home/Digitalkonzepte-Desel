<header class="site-header" data-header>
  <div class="wrap">
    <a class="logo" href="/"><img src="/assets/img/logo.png" alt="Digitalkonzepte Desel, zur Startseite" width="640" height="140"></a>
    <nav class="nav" id="hauptnavigation" aria-label="Hauptnavigation" data-nav>
      {{nav}}
      <a class="btn btn-primary nav-cta" href="/kontakt">Erstgespräch</a>
    </nav>
    <div class="header-tools">
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Zwischen hellem und dunklem Design wechseln">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn burger" type="button" data-menu-toggle aria-expanded="false" aria-controls="hauptnavigation" aria-label="Menü öffnen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="b1" d="M4 8h16"/><path class="b2" d="M4 16h16"/></svg>
      </button>
    </div>
  </div>
</header>
